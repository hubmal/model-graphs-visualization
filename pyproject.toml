[project]
name = "model-graphs-visualization"
version = "0.1.0"
description = "Visualize neural network computational graphs with configurable transformation passes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.21",
    "openvino>=2025.0",
]

[project.scripts]
model-graph-viewer = "graph_viewer.cli:main"

[project.optional-dependencies]
# Only needed to export Hugging Face models to OpenVINO IR (optimum-cli).
export = [
    "optimum-intel[openvino]>=1.20",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: much smaller than the default CUDA build. torch and torchvision
# must come from the same index, otherwise torchvision's compiled ops don't match torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
